    const L = Math.hypot(bx - ax, by - ay), d = (it.z1 - it.z0) * S;
    const m = new THREE.Mesh(new THREE.BoxGeometry(L, 0.01, d), matFor('R'));
    m.position.set((ax + bx) / 2, (ay + by) / 2 - 0.005, -(it.z0 + it.z1) / 2 * S);
    m.rotation.z = Math.atan2(by - ay, bx - ax); m.castShadow = m.receiveShadow = true;
    m.userData.z = (it.z0 + it.z1) / 2; m.userData.soffit = true;
    scene.add(m); groups.all.push(m); groups.front.push(m);
  }
}
const spMat = new THREE.MeshStandardMaterial({color: 0x8b6a43, roughness: 0.9});
for (const s of DATA.spacers) {
  const L = (s.z1 - s.z0) * S;
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, L), spMat);
  m.position.set(s.x * S - CX, s.y * S, -(s.z0 + s.z1) / 2 * S); m.userData.z = (s.z0 + s.z1) / 2;
  scene.add(m); groups.structure.push(m); groups.all.push(m);
}
// benzi LED (vizual) pe podea, intre layere
const ledMat = new THREE.MeshBasicMaterial({color: 0xffd08a});
for (const zz of [35, 105, 175, 250, 335]) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(8.2, 0.006, 0.012), ledMat);
  m.position.set(0, 0.004, -zz * S); m.userData.z = zz; m.userData.led = true; scene.add(m); groups.all.push(m);
}

// ---------------------------------------------------------------- post-procesare (stralucire)
const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.45, 0.78);
composer.addPass(bloom);

// ---------------------------------------------------------------- vederi + comutatoare
const views = {
  front: [[0, 1.0, 8.6], [0, 0.95, -0.2]],
  left: [[-5.6, 2.0, 6.0], [-0.4, 0.85, -0.2]],
  right: [[5.6, 2.0, 6.0], [0.4, 0.85, -0.2]],
  side: [[-8.2, 1.4, -0.3], [-3.2, 0.9, -0.3]],
  top: [[0, 8.5, 1.5], [0, 0, -0.3]],
};
function setView(v) { const [p, t] = views[v]; camera.position.set(...p); controls.target.set(...t); controls.update(); }
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => setView(b.dataset.v));
let explode = 1;
document.getElementById('bExplode').onclick = e => { explode = explode === 1 ? 4 : 1; e.target.classList.toggle('on', explode !== 1); applyExplode(); };
function applyExplode() {
  for (const m of groups.all) {
    const z = m.userData.z || 0;
    if (m.userData.plane === 'ZY') { m.scale.x = explode; continue; }
    if (m.userData.plane === 'XY') m.position.z = -((z * explode) + 10) * S;
    else m.position.z = -z * explode * S;
  }
}
let structOn = false;
document.getElementById('bStruct').onclick = e => {
  structOn = !structOn; e.target.classList.toggle('on', structOn);
  for (const m of groups.front) { m.material = m.material; }
  for (const g in mats) { mats[g].transparent = structOn && g !== 'N'; mats[g].opacity = structOn && g !== 'N' ? 0.35 : 1; mats[g].depthWrite = !(structOn && g !== 'N'); }
  spMat.color.set(structOn ? 0x2fae6e : 0x8b6a43); mats.N && mats.N.color.set(structOn ? 0xd9473a : 0xb99d75);
};
let ledOn = true;
document.getElementById('bLed').onclick = e => {
  ledOn = !ledOn; e.target.classList.toggle('on', ledOn);
  for (const g in mats) mats[g].emissiveIntensity = ledOn ? mats[g].userData.base : 0;
  glowMat.color.set(ledOn ? 0xffc46b : 0x3a3027); starLight.intensity = ledOn ? 1.4 : 0; ledMat.color.set(ledOn ? 0xffd08a : 0x333333);
  key.intensity = ledOn ? 0.55 : 1.2;
};
const qs = new URLSearchParams(location.search);
setView(qs.get('v') || 'front');
if (qs.get('explode')) { explode = 4; document.getElementById('bExplode').classList.add('on'); applyExplode(); }
if (qs.get('ui') === '0') { document.getElementById('ui').style.display = 'none'; document.getElementById('legend').style.display = 'none'; }
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });
(function loop() { controls.update(); composer.render(); requestAnimationFrame(loop); })();
window.__ready = true;
</script>
</body>
</html>
